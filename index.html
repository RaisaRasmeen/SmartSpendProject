<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
        <meta name="description" content="SmartSpend-a modern 2026 expense tracker built with vanilla JS./">
        <title>SmartSpend-Track your money</title>
        <link rel="stylesheet"href="style.css"/>
        </head>
        <body>
            <header class="topbar">
                <div class="brand"><span class="dot"></span>SmartSpend</div>
                <button id="themeBtn" class="ghost">Dark Mode</button>
            </header>

        <main class="wrap">
        <section class="cards">
            <article class="card">
        <p class ="label">Income</p>
        <h2 id="totalIncome" class="up">\$0.00</h2>
</article>
<article class="card">
    <p class="label">Expenses</p>
    <h2 id="totalExpenses" class="down">\$0.00</h2>
</article>
<article class="card highlight">
    <p class="label">Balance</p>
    <h2 id="balance">\$0.00</h2>
</article>
       </section>

       <section class="grid">
<from id="txForm" class="pannel">
    <h3>Add Transaction</h3>
    <label>Title<input type="text" name="title" placeholder="e.g. Grocery" required /></label>
    <label>Amount<input type="number" name="amount" min="1" step="0.01" placeholder="0.00" required /></label>
<div class="row">
          <label>Type
            <select name="type" required>
              <option value="expense">Expense</option>
              <option value="income">Income</option>
            </select>
          </label>
           <label>Category
            <select name="category" required>
              <option>Food</option>
              <option>Transport</option>
              <option>Bills</option>
              <option>Shopping</option>
              <option>Salary</option>
              <option>Other</option>
            </select>
          </label>
        </div>
         <label>Date
          <input type="date" name="date" required />
        </label>

        <button type="submit" class="primary">+ Add Transaction</button>

</from>
